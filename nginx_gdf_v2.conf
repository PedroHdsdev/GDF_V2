# Main Server
server {
    listen 80;
    server_name localhost 127.0.0.1;
    
    # Tamanho máximo de upload
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss;
    gzip_min_length 1000;
    gzip_comp_level 6;
    
    # Buffer sizes para evitar "upstream sent too big header"
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_body_buffer_size 128k;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Keep-alive
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # Main application
    location / {
        proxy_pass http://django_gdf_backend;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Redirect handling
        proxy_redirect off;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Static files (CSS, JS, Images)
    location /static/ {
        alias /var/www/gdf_v2/staticfiles/;
        
        # Cache control
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Compression
        gzip_static on;
        
        # Log
        access_log off;
    }
    
    # Media files (uploads)
    location /media/ {
        alias /var/www/gdf_v2/media/;
        
        # Cache control (menos que static)
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Health check endpoint (para verificar se servidor está vivo)
    location /health/ {
        proxy_pass http://django_gdf_backend;
        access_log off;
    }
    
    # Logging
    access_log /var/log/nginx/gdf_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/gdf_error.log warn;
}
