# Nginx Configuration for GDF_V2 - Load Balancing
# Local de instalação: /etc/nginx/sites-available/gdf_v2
# Após criar, fazer symlink: ln -s /etc/nginx/sites-available/gdf_v2 /etc/nginx/sites-enabled/

upstream django_gdf_backend {
    # Algoritmo de distribuição
    least_conn;  # Envia requisição para o servidor com menos conexões
    
    # Servidores backend
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    
    # Se um servidor cair, pula para o próximo
    # max_fails=3: marcar como down após 3 falhas
    # fail_timeout=30s: tentar novamente após 30s
}

# Redirecionar HTTP para HTTPS (em produção)
server {
    listen 80;
    server_name seu-dominio.com www.seu-dominio.com;
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server (descomente em produção)
