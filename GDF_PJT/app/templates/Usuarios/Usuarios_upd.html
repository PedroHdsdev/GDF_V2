<div class="modal fade" id="modalUsuarioUpd" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <form method="post" id="formUsuarioUpd">
        {% csrf_token %}
        <input type="hidden" name="user_id" id="upd_user_id">

        <div class="modal-header">
          <h5 class="modal-title">Editar Usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-upd-dados">
                Dados
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-upd-empresas">
                Empresas
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-upd-grupos">
                Grupos
              </button>
            </li>
          </ul>

          <div class="tab-content">

            <!-- DADOS -->
            <div class="tab-pane fade show active" id="tab-upd-dados">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Usuário</label>
                  <input type="text" id="upd_username" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                  <label class="form-label">E-mail</label>
                  <input type="email" id="upd_email" class="form-control">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Nome</label>
                  <input type="text" id="upd_first_name" class="form-control">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Sobrenome</label>
                  <input type="text" id="upd_last_name" class="form-control">
                </div>

                <div class="form-check mt-3">
                  <input class="form-check-input" type="checkbox" id="upd_is_active">
                  <label class="form-check-label">Usuário ativo</label>
                </div>
              </div>
            </div>

            <!-- EMPRESAS -->
            <div class="tab-pane fade" id="tab-upd-empresas">
              <select id="upd_empresas" class="form-select" multiple size="8">
                {% for emp in t_empresas %}
                  <option value="{{ emp.id }}">{{ emp.nome }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- GRUPOS -->
            <div class="tab-pane fade" id="tab-upd-grupos">
              <select id="upd_grupos" class="form-select" multiple size="8">
                {% for grp in t_AuthGroup %}
                  <option value="{{ grp.id }}">{{ grp.name }}</option>
                {% endfor %}
              </select>
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>

      </form>

    </div>
  </div>
</div>
