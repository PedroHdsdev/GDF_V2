<div class="modal fade" id="modalUsuarioUpd" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <form method="post" id="formUsuarioUpd" action="{% url 'Usuario_upd' user.id %}" onsubmit="fn_validar_formulario_upd(event)">
        {% csrf_token %}
        <input type="hidden" name="user_id" id="upd_user_id">

        <div class="modal-header">
          <h5 class="modal-title">Editar Usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
              <button type="button" class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-upd-dados">
                Dados
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-upd-empresas">
                Empresas
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-upd-grupos">
                Grupos
              </button>
            </li>
          </ul>

          <div class="tab-content">

            <!-- DADOS -->
            <div class="tab-pane fade show active" id="tab-upd-dados">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Usuário</label>
                  <input type="text" id="upd_username" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                  <label class="form-label">E-mail</label>
                  <input type="email" id="upd_email" class="form-control">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Nome</label>
                  <input type="text" id="upd_first_name" class="form-control">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Sobrenome</label>
                  <input type="text" id="upd_last_name" class="form-control">
                </div>

                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="upd_is_active">
                  <label class="form-check-label" for="upd_is_active">Usuário ativo</label>
                </div>
              </div>
            </div>

            <!-- EMPRESAS -->
            <div class="tab-pane fade" id="tab-upd-empresas">
              <div class="mb-3">
                <label class="form-label">Selecionar Empresa</label>
                <div class="input-group">
                  <select id="upd_empresas_select" class="form-select">
                    <option value="">-- Selecione uma empresa --</option>
                  </select>
                  <button type="button" class="btn btn-success" onclick="fn_adicionar_empresa()">
                    <i class="bi bi-plus-lg"></i> Adicionar
                  </button>
                </div>
              </div>
              
              <!-- Tabela de Empresas Selecionadas -->
              <div class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th>Empresa</th>
                      <th class="text-center" style="width: 80px;">Ação</th>
                    </tr>
                  </thead>
                  <tbody id="upd_empresas_tbody">
                    <!-- Preenchido por JavaScript -->
                  </tbody>
                </table>
              </div>
              
              <!-- Hidden input para enviar valores ao servidor -->
              <input type="hidden" name="ls_empresas" id="upd_empresas_hidden" value="">
            </div>

            <!-- GRUPOS -->
            <div class="tab-pane fade" id="tab-upd-grupos">
              <div class="mb-3">
                <label class="form-label">Selecionar Grupo</label>
                <div class="input-group">
                  <select id="upd_grupos_select" class="form-select">
                    <option value="">-- Selecione um grupo --</option>
                  </select>
                  <button type="button" class="btn btn-success" onclick="fn_adicionar_grupo()">
                    <i class="bi bi-plus-lg"></i> Adicionar
                  </button>
                </div>
              </div>
              
              <!-- Tabela de Grupos Selecionados -->
              <div class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th>Grupo</th>
                      <th class="text-center" style="width: 80px;">Ação</th>
                    </tr>
                  </thead>
                  <tbody id="upd_grupos_tbody">
                    <!-- Preenchido por JavaScript -->
                  </tbody>
                </table>
              </div>
              
              <!-- Hidden input para enviar valores ao servidor -->
              <input type="hidden" name="ls_grupos" id="upd_grupos_hidden" value="">
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>

      </form>

    </div>
  </div>
</div>
