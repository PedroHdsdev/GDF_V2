<div class="modal fade" id="modalUsuarioIns" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <form method="post" action="{% url 'Usuario_ins' %}">
        {% csrf_token %}

        <div class="modal-header">
          <h5 class="modal-title">Cadastrar Usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <!-- NAV TABS -->
          <ul class="nav nav-tabs mb-3" role="tablist">
            <li class="nav-item">
              <button type="button" class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-ins-dados">
                Dados do Usuário
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-ins-empresas">
                Empresas
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-ins-grupos">
                Grupos
              </button>
            </li>
          </ul>

          <div class="tab-content">

            <!-- TAB 1: DADOS -->
            <div class="tab-pane fade show active" id="tab-ins-dados">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Usuário</label>
                  <input type="text" name="username" class="form-control" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">E-mail</label>
                  <input type="email" name="email" class="form-control" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Nome</label>
                  <input type="text" name="first_name" class="form-control">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Sobrenome</label>
                  <input type="text" name="last_name" class="form-control">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Senha</label>
                  <input type="password" name="password" class="form-control" required>
                </div>
              </div>
            </div>

            <!-- TAB 2: EMPRESAS -->
            <div class="tab-pane fade" id="tab-ins-empresas">
              <div class="mb-3">
                <label class="form-label">Selecionar Empresa</label>
                <div class="input-group">
                  <select id="ins_empresas_select" class="form-select">
                    <option value="">-- Selecione uma empresa --</option>
                    {% for emp in t_empresas %}
                      <option value="{{ emp.cod_empresa }}" data-nome="{{ emp.nome }}">{{ emp.nome }}</option>
                    {% endfor %}
                  </select>
                  <button type="button" class="btn btn-success" onclick="adicionarEmpresaIns()">
                    <i class="bi bi-plus-lg"></i> Adicionar
                  </button>
                </div>
              </div>
              
              <!-- Tabela de Empresas Selecionadas -->
              <div class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th>Empresa</th>
                      <th class="text-center" style="width: 80px;">Ação</th>
                    </tr>
                  </thead>
                  <tbody id="ins_empresas_tbody">
                    <!-- Preenchido por JavaScript -->
                  </tbody>
                </table>
              </div>
              
              <!-- Hidden input para enviar valores ao servidor -->
              <input type="hidden" name="ls_empresas" id="ins_empresas_hidden" value="">
            </div>

            <!-- TAB 3: GRUPOS -->
            <div class="tab-pane fade" id="tab-ins-grupos">
              <div class="mb-3">
                <label class="form-label">Selecionar Grupo</label>
                <div class="input-group">
                  <select id="ins_grupos_select" class="form-select">
                    <option value="">-- Selecione um grupo --</option>
                    {% for grp in t_auth_groups %}
                      <option value="{{ grp.id }}" data-nome="{{ grp.name }}">{{ grp.name }}</option>
                    {% endfor %}
                  </select>
                  <button type="button" class="btn btn-success" onclick="adicionarGrupoIns()">
                    <i class="bi bi-plus-lg"></i> Adicionar
                  </button>
                </div>
              </div>

              <!-- Tabela de Grupos Selecionados -->
              <div class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th>Grupo</th>
                      <th class="text-center" style="width: 80px;">Ação</th>
                    </tr>
                  </thead>
                  <tbody id="ins_grupos_tbody">
                    <!-- Preenchido por JavaScript -->
                  </tbody>
                </table>
              </div>

              <!-- Hidden input para enviar valores ao servidor -->
              <input type="hidden" name="ls_grupos" id="ins_grupos_hidden" value="">
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>

      </form>
    </div>
  </div>
</div>
