{% load static %}
<div class="modal fade admin-modal" id="modalEmpresaUpd" tabindex="-1" aria-labelledby="modalEmpresaUpdLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalEmpresaUpdLabel">
          <span class="modal-title-icon"><i class="fas fa-building"></i></span>
          Editar Empresa
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>

      <div class="modal-body">
        <div id="modalEmpresaUpdAlerts" class="admin-modal-alerts"></div>

        <ul class="nav nav-tabs" id="empresaTabs" role="tablist">
          <li class="nav-item">
            <button type="button" class="nav-link active" id="tab-empresa-btn" data-bs-toggle="tab" data-bs-target="#tab-empresa" role="tab"><i class="fas fa-edit"></i> Dados da Empresa</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" id="tab-certificado-btn" data-bs-toggle="tab" data-bs-target="#tab-certificado" role="tab"><i class="fas fa-certificate"></i> Certificado Digital</button>
          </li>
        </ul>

        <!-- REMOVER MENSAGENS ANTIGAS DO DJANGO -->
        {% if messages %}
          {% for message in messages %}
            {% if message.extra_tags == 'MODAL_UPD' %}
              <!-- Mensagens serão renderizadas pelo JavaScript -->
            {% endif %}
          {% endfor %}
        {% endif %}

        <!-- TAB CONTENT -->
        <div class="tab-content">

          <!-- TAB 1: DADOS DA EMPRESA -->
          <div class="tab-pane fade show active" id="tab-empresa" role="tabpanel">
            <form method="post" id="formEmpresaUpd" action="" onsubmit="fn_validar_formulario_upd(event)">
              {% csrf_token %}
              <input type="hidden" id="upd_empresa_id_hidden" name="m_empresa_id" value="">

              <div class="row g-3">
                
                <div class="col-md-4">
                  <label for="upd_empresa_id" class="form-label">Código Empresa</label>
                  <input
                    type="text"
                    id="upd_empresa_id"
                    name="m_empresa_id"
                    class="form-control"
                    readonly>
                </div>

                <div class="col-md-4">
                  <label for="upd_emp_cnpj" class="form-label">CNPJ</label>
                  <input
                    type="text"
                    id="upd_emp_cnpj"
                    name="m_emp_cnpj"
                    class="form-control"
                    readonly>
                </div>

                <div class="col-md-4">
                  <label for="upd_tipo" class="form-label">Tipo</label>
                  <input
                    type="text"
                    id="upd_tipo"
                    name="m_tipo"
                    class="form-control"
                    readonly>
                </div>

                <div class="col-md-6">
                  <label for="upd_razao" class="form-label">Razão Social</label>
                  <input
                    type="text"
                    id="upd_razao"
                    name="m_razao"
                    class="form-control">
                </div>

                <div class="col-md-6">
                  <label for="upd_fantasia" class="form-label">Nome Fantasia</label>
                  <input
                    type="text"
                    id="upd_fantasia"
                    name="m_fantasia"
                    class="form-control">
                </div>

                <div class="col-md-4">
                  <label for="upd_ie" class="form-label">Inscrição Estadual</label>
                  <input
                    type="text"
                    id="upd_ie"
                    name="m_ie"
                    class="form-control">
                </div>

                <div class="col-md-4">
                  <label for="upd_im" class="form-label">Inscrição Municipal</label>
                  <input
                    type="text"
                    id="upd_im"
                    name="m_im"
                    class="form-control">
                </div>

                <div class="col-md-4">
                  <label for="upd_iest" class="form-label">IE Substituto Tributário</label>
                  <input
                    type="text"
                    id="upd_iest"
                    name="m_iest"
                    class="form-control">
                </div>

                <div class="col-md-3">
                  <label for="upd_crt" class="form-label">CRT</label>
                  <input
                    type="text"
                    id="upd_crt"
                    name="m_crt"
                    class="form-control">
                </div>

                <div class="col-md-3">
                  <label for="upd_cnae" class="form-label">CNAE</label>
                  <input
                    type="text"
                    id="upd_cnae"
                    name="m_cnae"
                    class="form-control">
                </div>

                <div class="col-md-3">
                  <label for="upd_suframa" class="form-label">SUFRAMA</label>
                  <input
                    type="text"
                    id="upd_suframa"
                    name="m_suframa"
                    class="form-control">
                </div>

                <div class="col-md-3">
                  <label class="form-label">Matriz</label>
                  <div class="form-check form-switch mt-2">
                    <input
                      type="checkbox"
                      id="upd_matriz"
                      name="m_matriz"
                      class="form-check-input">
                    <label class="form-check-label" for="upd_matriz">É Matriz</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="upd_cliente_id" class="form-label">Cliente</label>
                  <input
                    type="text"
                    id="upd_cliente_id"
                    name="m_cliente_id"
                    class="form-control"
                    readonly>
                </div>

                <div class="col-md-12">
                  <label for="upd_chave_acesso" class="form-label">Chave de Acesso</label>
                  <input
                    type="text"
                    id="upd_chave_acesso"
                    name="m_chave_acesso"
                    class="form-control">
                </div>

              </div>

              <div class="d-flex gap-2 mt-4">
                <button
                  type="submit"
                  id="btn-save-empresa"
                  class="btn btn-success">
                  Salvar
                </button>
                <button
                  type="button"
                  id="btn-cancel-empresa"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal">
                  Cancelar
                </button>
              </div>

            </form>
          </div>

          <!-- TAB 2: CERTIFICADO DIGITAL -->
          <div class="tab-pane fade" id="tab-certificado" role="tabpanel">
            <form method="post" id="formCertUpd" action="{{ url_prefix|default:'' }}{% url 'Cert_upd' %}" enctype="multipart/form-data" onsubmit="fn_validar_certificado(event)">
              {% csrf_token %}
              <input type="hidden" id="upd_cert_codempresa" name="m_codempresa">

              <div class="row g-3">
                
                <div class="col-md-12">
                  <label for="upd_cert_file" class="form-label">Arquivo do Certificado (.crt, .txt)</label>
                  <input
                    type="file"
                    id="upd_cert_file"
                    name="m_file"
                    class="form-control"
                    accept=".crt,.txt">
                </div>

                <div class="col-md-6">
                  <label for="upd_senha_certificado" class="form-label">Senha do certificado</label>
                  <input
                    type="password"
                    id="upd_senha_certificado"
                    name="m_senha_certificado"
                    class="form-control"
                    placeholder="Senha do certificado"
                    autocomplete="off">
                </div>

                <div class="col-md-6">
                  <label for="upd_emissor" class="form-label">Emissor</label>
                  <input
                    type="text"
                    id="upd_emissor"
                    name="m_emissor"
                    class="form-control">
                </div>

                <div class="col-md-6">
                  <label for="upd_cert_cnpj" class="form-label">CNPJ do Certificado</label>
                  <input
                    type="text"
                    id="upd_cert_cnpj"
                    name="m_cnpj"
                    class="form-control"
                    readonly>
                </div>

                <div class="col-md-6">
                  <label for="upd_dt_inicial" class="form-label">Data Início Validade</label>
                  <input
                    type="text"
                    id="upd_dt_inicial"
                    name="m_dt_inicial"
                    class="form-control">
                </div>

                <div class="col-md-6">
                  <label for="upd_dt_fim" class="form-label">Data Fim Validade</label>
                  <input
                    type="text"
                    id="upd_dt_fim"
                    name="m_dt_fim"
                    class="form-control">
                </div>

              </div>

              <div class="d-flex gap-2 mt-4">
                <button
                  type="submit"
                  id="btn-save-cert"
                  class="btn btn-success">
                  Salvar
                </button>
                <button
                  type="button"
                  id="btn-cancel-cert"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal">
                  Cancelar
                </button>
              </div>

            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
