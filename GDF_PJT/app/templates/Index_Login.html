{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS proprio -->
  <link rel="stylesheet" href="{% static 'css/Style_Login.css' %}">
</head>
<body>
  <!-- Loader 
  <div id="loading-overlay">
    <div class="loader"></div>
  </div>-->
  <!-- Formulário centralizado -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm p-5 " style="background-color: rgba(0, 0, 0, 0.384); width: 100%; max-width: 600px;">
          <div class="text-center mb-4">
            <img src="{% static 'img/logo_Process.png' %}" class="img-fluid" alt="Logo">
          </div>
          <form method="POST" action="{% url 'Login' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="Username" class="form-label text-white">Usuário:</label>
              <input type="text" class="form-control" id="Username" name="Username" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label text-white">Senha:</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>

            {% if error_message %}
            <div class="text-danger mb-3">{{ error_message }}</div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
