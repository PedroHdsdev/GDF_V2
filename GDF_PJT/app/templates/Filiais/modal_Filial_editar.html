<div class="modal fade admin-modal" id="modalFilialEditar" tabindex="-1" aria-labelledby="modalFilialEditarLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <form id="formFilialEditar" onsubmit="return fn_submit_editar_filial(event)">
        {% csrf_token %}

        <div class="modal-header">
          <h5 class="modal-title" id="modalFilialEditarLabel">
            <span class="modal-title-icon"><i class="fas fa-edit"></i></span>
            Editar Filial
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <div id="modalFilialEditarAlerts" class="admin-modal-alerts"></div>
          <p class="admin-step-hint text-muted small mb-3">
            <i class="fas fa-info-circle me-1"></i> Altere os dados da filial. A empresa não pode ser alterada.
          </p>
          <input type="hidden" id="edt_filial_id" name="m_id" value="">
          <div class="mb-3">
            <label class="form-label">Empresa</label>
            <p id="edt_filial_empresa_display" class="form-control-plaintext fw-semibold text-muted mb-0">—</p>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="edt_filial_cod" class="form-label">* Código da filial</label>
              <input
                type="text"
                id="edt_filial_cod"
                name="m_cod_filial"
                class="form-control"
                placeholder="Ex: 001"
                maxlength="10"
                required>
            </div>
            <div class="col-md-6">
              <label for="edt_filial_nome" class="form-label">Nome</label>
              <input
                type="text"
                id="edt_filial_nome"
                name="m_nome"
                class="form-control"
                placeholder="Nome ou razão social da filial"
                maxlength="120">
            </div>
            <div class="col-md-6">
              <label for="edt_filial_cnpj" class="form-label">CNPJ</label>
              <input
                type="text"
                id="edt_filial_cnpj"
                name="m_cnpj"
                class="form-control"
                placeholder="00.000.000/0000-00"
                maxlength="18">
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <div class="form-check form-switch mt-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="edt_filial_ativo"
                  name="m_ativo">
                <label class="form-check-label" for="edt_filial_ativo">Filial ativa</label>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
