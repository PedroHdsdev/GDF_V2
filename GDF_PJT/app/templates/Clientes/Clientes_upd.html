{% load static %}
<div class="modal fade" id="modalClienteUpd" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- CONTAINER DE MENSAGENS DO MODAL -->
        <div id="modalClienteUpdAlerts"></div>

        <!-- NAV TABS -->
        <ul class="nav nav-tabs mb-3" id="clienteTabs" role="tablist">
          <li class="nav-item">
            <button
              type="button"
              class="nav-link active"
              id="tab-cliente-btn"
              data-bs-toggle="tab"
              data-bs-target="#tab-cliente"
              role="tab">
              Dados do Cliente
            </button>
          </li>
          <li class="nav-item">
            <button
              type="button"
              class="nav-link"
              id="tab-acesso-btn"
              data-bs-toggle="tab"
              data-bs-target="#tab-acesso"
              role="tab">
              Direitos de Acesso
            </button>
          </li>
          <li class="nav-item">
            <button
              type="button"
              class="nav-link"
              id="tab-sap-btn"
              data-bs-toggle="tab"
              data-bs-target="#tab-sap"
              role="tab">
              Conexão SAP
            </button>
          </li>
        </ul>

        <!-- REMOVER MENSAGENS ANTIGAS DO DJANGO -->
        {% if messages %}
          {% for message in messages %}
            {% if message.extra_tags == 'MODAL_UPD' %}
              <!-- Mensagens serão renderizadas pelo JavaScript -->
            {% endif %}
          {% endfor %}
        {% endif %}

        <!-- TAB CONTENT -->
        <div class="tab-content">

          <!-- TAB 1: DADOS DO CLIENTE -->
          <div class="tab-pane fade show active" id="tab-cliente" role="tabpanel">
            <form method="post" id="formClienteUpd" action="/cliente/" onsubmit="fn_validar_formulario_upd(event)">
              {% csrf_token %}
              <input type="hidden" id="upd_cliente_id" name="upd_cliente_id" value="">
              <div class="row g-3">
                
                <div class="col-md-6">
                  <label for="upd_codigo" class="form-label">Código do Cliente</label>
                  <input
                    type="text"
                    id="upd_codigo"
                    class="form-control"
                    readonly>
                </div>

                <div class="col-md-6">
                  <label for="upd_cnpj" class="form-label">CNPJ</label>
                  <input
                    type="text"
                    id="upd_cnpj"
                    name="upd_cnpj"
                    class="form-control">
                </div>

                <div class="col-md-12">
                  <label for="upd_razao" class="form-label">Razão Social</label>
                  <input
                    type="text"
                    id="upd_razao"
                    name="upd_razao"
                    class="form-control">
                </div>

                <div class="col-md-12">
                  <label class="form-label">Ativo</label>
                  <div class="form-check form-switch">
                    <input
                      type="checkbox"
                      id="upd_clie_active"
                      name="upd_is_active"
                      class="form-check-input">
                    <label class="form-check-label" for="upd_clie_active">Cliente ativo no sistema</label>
                  </div>
                </div>

              </div>

              <div class="d-flex gap-2 mt-4">
                <button
                  type="submit"
                  class="btn btn-primary">
                  Salvar Alterações
                </button>
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal">
                  Cancelar
                </button>
              </div>

            </form>
          </div>

          <!-- TAB 2: DIREITOS DE ACESSO -->
          <div class="tab-pane fade" id="tab-acesso" role="tabpanel">
            <form method="post" id="formAcessoUpd" action="/cliente/Acesso/">
              {% csrf_token %}
              <input type="hidden" id="Acesso_cliente_id" name="Acesso_cliente_id" value="">
              <div class="mb-3">
                <label class="form-label">Adicionar Solução</label>
                <div class="input-group">
                  <select id="upd_solucoes_select" class="form-select">
                    <option value="">-- Selecione uma solução --</option>
                  </select>
                  <button type="button" class="btn btn-success" onclick="fn_adicionar_solucao()">
                    <i class="bi bi-plus-lg"></i> Adicionar
                  </button>
                </div>
              </div>
              
              <!-- Tabela de Soluções Selecionadas -->
              <div class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th>Código</th>
                      <th>Descrição</th>
                      <th class="text-center" style="width: 100px;">Status</th>
                      <th class="text-center" style="width: 80px;">Ação</th>
                    </tr>
                  </thead>
                  <tbody id="upd_solucoes_tbody">
                    <!-- Preenchido por JavaScript -->
                  </tbody>
                </table>
              </div>
              
              <!-- Hidden input para enviar valores ao servidor -->
              <input type="hidden" name="ls_solucoes" id="upd_solucoes_hidden" value="">

              <div class="d-flex gap-2 mt-4">
                <button
                  type="submit"
                  class="btn btn-primary">
                  Salvar Acessos
                </button>
              </div>
            </form>
          </div>

          <!-- TAB 3: CONEXÃO SAP -->
          <div class="tab-pane fade" id="tab-sap" role="tabpanel">
            <input type="hidden" id="sap_cliente_id" value="">
            <!-- Sem registro: botão no centro para criar -->
            <div id="sap-sem-registro" class="d-flex align-items-center justify-content-center py-5 d-none" style="min-height: 200px;">
              <button type="button" class="btn btn-primary btn-lg" id="btn-criar-sap">
                <i class="bi bi-plus-circle"></i> Criar conexão SAP
              </button>
            </div>
            <!-- Com registro: formulário para editar -->
            <div id="sap-form-container" class="d-none">
              <form method="post" id="formSapUpd" action="">
                {% csrf_token %}
                <input type="hidden" name="sap_id" id="sap_id" value="">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="sap_ashost" class="form-label">Host (ashost)</label>
                    <input type="text" id="sap_ashost" name="sap_ashost" class="form-control" maxlength="100">
                  </div>
                  <div class="col-md-3">
                    <label for="sap_sysnr" class="form-label">Nº do sistema (sysnr)</label>
                    <input type="text" id="sap_sysnr" name="sap_sysnr" class="form-control" maxlength="10">
                  </div>
                  <div class="col-md-3">
                    <label for="sap_client" class="form-label">Cliente (client)</label>
                    <input type="text" id="sap_client" name="sap_client" class="form-control" maxlength="10">
                  </div>
                  <div class="col-md-6">
                    <label for="sap_username" class="form-label">Usuário</label>
                    <input type="text" id="sap_username" name="sap_username" class="form-control" maxlength="50">
                  </div>
                  <div class="col-md-6">
                    <label for="sap_passwd" class="form-label">Senha</label>
                    <input type="password" id="sap_passwd" name="sap_passwd" class="form-control" maxlength="50" autocomplete="off">
                  </div>
                  <div class="col-md-4">
                    <label for="sap_lang" class="form-label">Idioma (lang)</label>
                    <input type="text" id="sap_lang" name="sap_lang" class="form-control" maxlength="5">
                  </div>
                  <div class="col-md-8 d-flex align-items-end">
                    <div class="form-check form-switch mb-2">
                      <input type="checkbox" id="sap_active" name="sap_active" class="form-check-input" checked>
                      <label class="form-check-label" for="sap_active">Conexão ativa</label>
                    </div>
                  </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                  <button type="submit" class="btn btn-primary">Salvar conexão SAP</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
