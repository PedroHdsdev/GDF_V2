# Cole estes blocos DENTRO do server { } HTTPS do homo.processit.com.br,
# DEPOIS de "location = /gdf" e ANTES de "location /gdf/".
#
# Se o GDF roda no MESMO servidor que o Nginx (ex.: shire): use 127.0.0.1:8600.
# Se o GDF roda em outro host (ex.: 10.0.1.19): use 10.0.1.19:8600 no proxy_pass do Streamlit.
#
# Atenção: no seu config atual está "127.0.1.19" no proxy_pass do /gdf/ — provavelmente
# deveria ser 127.0.0.1 (local) ou 10.0.1.19 (backend remoto). Corrija se necessário.

    # Streamlit – dashboards (Compras/Vendas e outros por solução)
    location = /gdf/streamlit {
        return 301 $scheme://$host/gdf/streamlit/$is_args$args;
    }
    location /gdf/streamlit/ {
        proxy_pass http://127.0.0.1:8600/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        send_timeout 600;
    }
